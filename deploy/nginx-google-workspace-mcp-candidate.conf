# Loopback-only TLS candidate ingress for Hawkx Workspace MCP.
# Candidate testing preserves public authority and SNI/Host while binding to loopback.

server {
    listen 127.0.0.1:9443 ssl;
    server_name mcp.hawkxdev.dev;

    ssl_certificate /etc/letsencrypt/live/mcp.hawkxdev.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.hawkxdev.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    root /opt/google-workspace-mcp/public;
    index index.html;

    access_log /var/log/nginx/google-workspace-mcp-candidate-access.log;
    error_log /var/log/nginx/google-workspace-mcp-candidate-error.log;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action $gws_form_action" always;

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /privacy {
        expires -1;
        try_files /privacy/index.html =404;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/google-workspace-mcp-active.inc;

    location / {
        return 404;
    }
}
