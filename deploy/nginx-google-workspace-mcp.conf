# Public and runtime surface for Hawkx Workspace MCP.
# Replace __DOMAIN__ during deployment.
# nginx 1.24 requires the legacy HTTP/2 listen syntax.

limit_req_zone $binary_remote_addr zone=gws_authorize:1m rate=5r/s;

upstream gws_gmail {
    server 127.0.0.1:8431;
    keepalive 16;
}

upstream gws_calendar {
    server 127.0.0.1:8432;
    keepalive 16;
}

upstream gws_drive {
    server 127.0.0.1:8433;
    keepalive 16;
}

upstream gws_sheets {
    server 127.0.0.1:8434;
    keepalive 16;
}

upstream gws_docs {
    server 127.0.0.1:8435;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    root /opt/google-workspace-mcp/public;
    index index.html;

    access_log /var/log/nginx/google-workspace-mcp-access.log;
    error_log /var/log/nginx/google-workspace-mcp-error.log;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /privacy {
        expires -1;
        try_files /privacy/index.html =404;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location = /gmail/oauth/authorize {
        limit_req zone=gws_authorize burst=10 nodelay;
        proxy_pass http://gws_gmail;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location /gmail/ {
        proxy_pass http://gws_gmail;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /.well-known/oauth-authorization-server/gmail {
        proxy_pass http://gws_gmail;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
