# Bootstrap HTTP surface for DNS and ACME validation.
# Replace __DOMAIN__ during deployment.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/google-workspace-mcp/public;
    index index.html;

    access_log /var/log/nginx/google-workspace-mcp-access.log;
    error_log /var/log/nginx/google-workspace-mcp-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
