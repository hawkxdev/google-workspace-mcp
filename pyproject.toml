[project]
name = 'google-workspace-mcp'
version = '0.1.0'
description = 'Remote MCP servers for Google Workspace'
readme = 'README.md'
requires-python = '>=3.14'
license = { file = 'LICENSE' }
dependencies = [
    # MCP Python SDK.
    'mcp>=2,<3',
    'starlette>=1.6,<2',
    'uvicorn>=0.52,<0.53',
    'google-auth>=2.56,<3',
    'google-auth-oauthlib>=1.4,<2',
    'google-api-python-client>=2.198,<3',
    # MCP SDK Pydantic requirement.
    'pydantic>=2.12,<3',
    'pydantic-settings>=2.0,<3',
]

[project.scripts]
google-mcp-gmail = 'google_workspace_mcp.cli.gmail:main'
google-mcp-calendar = 'google_workspace_mcp.cli.calendar:main'
google-mcp-drive = 'google_workspace_mcp.cli.drive:main'
google-mcp-sheets = 'google_workspace_mcp.cli.sheets:main'
google-mcp-docs = 'google_workspace_mcp.cli.docs:main'
google-mcp-oauth = 'google_workspace_mcp.cli.oauth_admin:main'
google-mcp-authorize = 'google_workspace_mcp.cli.authorize:main'
google-mcp-cutover = 'google_workspace_mcp.cli.cutover:main'

[dependency-groups]
dev = [
    'pytest>=9.0,<10',
    'pytest-asyncio>=1.4,<2',
    'ruff>=0.16,<0.17',
    'mypy>=2.3,<3',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/google_workspace_mcp']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
addopts = '--strict-markers -ra --import-mode=importlib'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Full E rule selection.
select = ['E', 'F', 'I', 'SIM', 'UP', 'S', 'G']

[tool.ruff.lint.per-file-ignores]
# Test security allowances.
'tests/**/*.py' = ['S101', 'S105', 'S106']
# Insecure permissions and addresses are the subject under test.
'tests/core/test_hardening_regressions.py' = [
    'S101',
    'S103',
    'S104',
    'S105',
    'S106',
]
'tests/core/test_cutover_cli.py' = ['S101', 'S103', 'S108']
# Systemd invocation allowances.
'src/google_workspace_mcp/cli/cutover.py' = ['S603', 'S607']
# OAuth state allowances.
'src/google_workspace_mcp/auth/state.py' = ['E501', 'SIM105', 'S101']
# Google token URI allowance.
'src/google_workspace_mcp/google_auth/credentials.py' = ['S105']
# Credential security test allowances.
'tests/core/test_google_auth.py' = ['S103', 'S107', 'S603']
# Consent fixture defaults are the subject under test.
'tests/core/test_google_consent.py' = ['S107']
# Ingress script test allowances.
'tests/smoke/test_cutover_ingress_script.py' = ['S603', 'S607']

[tool.ruff.lint.isort]
known-first-party = ['google_workspace_mcp']

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true

[tool.mypy]
python_version = '3.14'
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ['googleapiclient.*', 'google_auth_oauthlib.*']
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = 'basic'
reportMissingTypeStubs = false
# Explicit Pyright exclusions.
exclude = [
    '**/.venv/**',
    '**/__pycache__/**',
    '**/node_modules/**',
]
